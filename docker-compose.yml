services:
  ollama:
    image: ollama/ollama
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    container_name: ollama
    pull_policy: always
    restart: unless-stopped
    tty: true

  api:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    depends_on:
      - ollama
    volumes:
      - ./data:/app/data
      - ./agents:/app/agents
      - ./scoring.py:/app/scoring.py
      - ./main.py:/app/main.py
    environment:
      - OLLAMA_BASE_URL=http://ollama:11434

volumes:
  ollama_data: